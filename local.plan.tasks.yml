app-id: local.plan.tasks
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: plan-tasks
appstream-compose: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: plan-tasks
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    run-tests: true
    test-rule: test
    post-install:
      - >-
        appstreamcli compose --no-net --prefix=/app --origin=local.plan.tasks
        --result-root=/app --data-dir=/app/share/app-info/xmls
        --icons-dir=/app/share/app-info/icons/flatpak --components=local.plan.tasks /
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .flatpak-builder
          - build
